<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicios</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: black;
            color: white;
        }
        .titulo {
            font-size: 24px;
            color: white;
            text-align: center;
            background-color: blue;
            padding: 10px;
            margin-bottom: 20px;
        }
        .service-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #3d3c3c;
            margin: 10px auto;
            padding: 10px;
            border-radius: 10px;
            width: 80%;
        }
        .service-icon {
            width: 40px;
            height: 40px;
        }
        .service-text {
            flex: 1;
            margin-left: 10px;
            font-size: 18px;
        }
        .service-button {
            padding: 10px 20px;
            background-color: green;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="titulo">✅ Servicios en Oferta</div>

<!-- Servicios -->
<div class="service-container">
    <img src="https://cdn-icons-png.flaticon.com/512/2111/2111646.png" class="service-icon" alt="WhatsApp">
    <div class="service-text">Venta de canales de WhatsApp</div>
    <a href="https://wa.me/1234567890?text=Me%20interesa%20comprar%20un%20canal%20de%20WhatsApp" 
       class="service-button" target="_blank">Comprar</a>
</div>

<div class="service-container">
    <img src="https://cdn-icons-png.flaticon.com/512/3955/3955024.png" class="service-icon" alt="Instagram">
    <div class="service-text">Venta de cuentas de Instagram</div>
    <a href="https://wa.me/1234567890?text=Me%20interesa%20comprar%20una%20cuenta%20de%20Instagram" 
       class="service-button" target="_blank">Comprar</a>
</div>

<div class="service-container">
    <img src="https://cdn-icons-png.flaticon.com/512/3670/3670147.png" class="service-icon" alt="Asesorías">
    <div class="service-text">Asesorías personalizadas</div>
    <a href="https://wa.me/1234567890?text=Me%20interesa%20recibir%20asesoría%20personalizada" 
       class="service-button" target="_blank">Comprar</a>
</div>

<div class="service-container">
    <img src="https://cdn-icons-png.flaticon.com/512/3670/3670211.png" class="service-icon" alt="Consultas">
    <div class="service-text">Consultas de servicios</div>
    <a href="https://wa.me/1234567890?text=Me%20interesa%20hacer%20una%20consulta%20sobre%20tus%20servicios" 
       class="service-button" target="_blank">Consultar</a>
</div>

</body>
</html>
